name: Worker — Validação e Publicação

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Compilar arquivos Python (sintaxe e bytecode)
        run: |
          python -m compileall -q .

      - name: Executar testes automatizados (unitários e isolados)
        run: |
          python -m unittest discover -s tests -v

      - name: Validar Compose (docker compose config)
        run: |
          WORKER_IMAGE="ghcr.io/poolsafe/poolsafe_integracao:ci-validate" docker compose config

  publish:
    name: Construir, Verificar e Publicar Imagem no GHCR
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Liberar espaço em disco no runner
        run: |
          echo "=== Espaço em disco antes da limpeza ==="
          df -h /
          # Remove toolchains e SDKs pesados pré-instalados no runner (Android, .NET, Haskell, JVM, etc.)
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes
          sudo apt-get clean
          echo "=== Espaço em disco após limpeza ==="
          df -h /

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados e tags da imagem
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.sha }}

      - name: Construir imagem Docker localmente para verificação (linux/amd64)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Verificar instalação e importação das dependências dentro da imagem
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Executa sem GPU, sem pesos, sem acesso aos serviços e sem iniciar main.py.
          # Execução isolada sem rede (--network none) para validar instalação e importação.
          FIRST_TAG=$(echo "$TAGS" | head -n 1)
          docker run --rm --network none "$FIRST_TAG" python -c "
          import cv2
          import pika
          import torch
          import torchvision
          import ultralytics
          print('OK: torch, torchvision, cv2, ultralytics e pika importados com sucesso')
          "

      - name: Publicar imagem verificada no GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Publica o artefato exato previamente verificado (sem reconstruir)
          for tag in $TAGS; do
            echo "Publicando tag: $tag"
            docker push "$tag"
          done

      - name: Registrar digest e resumo da execução
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          PRIMARY_TAG=$(echo "$TAGS" | head -n 1)
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "$PRIMARY_TAG" | head -n 1)

          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker inspect --format='{{index .Id}}' "$PRIMARY_TAG")
          fi

          echo "### Publicação no GHCR Concluída" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repositório:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Revisão:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest publicado:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags publicadas:**" >> $GITHUB_STEP_SUMMARY
          for tag in $TAGS; do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
