name: poolsafe-worker

# Stack Portainer para execução do worker Python PoolSafe
# Integração: captura -> inferência (YOLO11) -> confirmação temporal -> outbox SQLite -> RabbitMQ
# Reutiliza a rede externa 'poolsafe-network' e o broker 'rabbitmq:5672' (vhost 'poolsafe').
# Não expõe portas externas nem cria serviços auxiliares.

services:
  poolsafe:
    image: ${WORKER_IMAGE:?Defina WORKER_IMAGE}
    container_name: ${CONTAINER_NAME:-poolsafe-worker}
    restart: "${WORKER_RESTART:-no}"
    cpus: "${WORKER_CPUS:-2}"
    mem_limit: ${WORKER_MEMORY:-3g}
    pids_limit: 256
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 45s
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CAMERA_ID: ${CAMERA_ID:-camera_teste_01}
      CODIGO_INTEGRACAO: ${CODIGO_INTEGRACAO:-}
      SOURCE_MODE: ${SOURCE_MODE:-video}
      SOURCE: ${SOURCE:-/entrada/teste.mp4}
      MODEL_PATH: /modelos/best.pt
      MODEL_VERSION: ${MODEL_VERSION:-candidato}
      DEVICE: ${DEVICE:-cpu}
      ENGINE_VERSION: ${ENGINE_VERSION:-v4}
      ENGINE_FPS: ${ENGINE_FPS:-15}
      CONF_NORMAL: ${CONF_NORMAL:-0.30}
      CONF_DESEQUILIBRIO: ${CONF_DESEQUILIBRIO:-0.65}
      CONF_QUEDA: ${CONF_QUEDA:-0.50}
      FRAMES_DESEQUILIBRIO: ${FRAMES_DESEQUILIBRIO:-15}
      EVIDENCIAS_QUEDA: ${EVIDENCIAS_QUEDA:-10}
      TOLERANCIA_QUEDA_FRAMES: ${TOLERANCIA_QUEDA_FRAMES:-1}
      DEDUP_IOU: ${DEDUP_IOU:-0.50}
      DEDUP_INTERVALO_S: ${DEDUP_INTERVALO_S:-1.5}
      HANDOFF_ENABLED: ${HANDOFF_ENABLED:-true}
      HANDOFF_IOU: ${HANDOFF_IOU:-0.70}
      HANDOFF_INTERVALO_S: ${HANDOFF_INTERVALO_S:-0.30}
      EMIT_ATTENTION: ${EMIT_ATTENTION:-true}
      TORCH_THREADS: ${TORCH_THREADS:-2}
      TORCH_INTEROP_THREADS: ${TORCH_INTEROP_THREADS:-1}
      OPENCV_THREADS: ${OPENCV_THREADS:-1}
      METRICS_WINDOW: ${METRICS_WINDOW:-1024}
      METRICS_INTERVAL_S: ${METRICS_INTERVAL_S:-15}
      HEALTH_STALE_S: ${HEALTH_STALE_S:-90}
      V4_LOG_EVERY_N_FRAMES: ${V4_LOG_EVERY_N_FRAMES:-150}
      SHUTDOWN_DRAIN_S: ${SHUTDOWN_DRAIN_S:-15}
      MODEL_SHA256: ${MODEL_SHA256:-}
      OMP_NUM_THREADS: ${TORCH_THREADS:-2}
      MKL_NUM_THREADS: ${TORCH_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${TORCH_THREADS:-2}
      LOG_MODE: ${LOG_MODE:-production}
      TEST_MODE: ${TEST_MODE:-true}
      ALLOW_TEST_PUBLISH: ${ALLOW_TEST_PUBLISH:-false}
      PUBLISH_RABBIT: ${PUBLISH_RABBIT:-false}
      INCLUDE_EVIDENCE: ${INCLUDE_EVIDENCE:-false}
      IOU: ${IOU:-0.70}
      IMGSZ: ${IMGSZ:-640}
      FRAMES_NORMAIS_ENCERRAR: ${FRAMES_NORMAIS_ENCERRAR:-15}
      COOLDOWN_S: ${COOLDOWN_S:-3}
      CONTINUIDADE_MAX_INTERVALO_S: ${CONTINUIDADE_MAX_INTERVALO_S:-2.0}
      MAX_INTERVALO_S: ${MAX_INTERVALO_S:-0.5}
      HEARTBEAT_INTERVAL_S: ${HEARTBEAT_INTERVAL_S:-30}
      HEARTBEAT_TTL_S: ${HEARTBEAT_TTL_S:-60}
      ALERT_TTL_S: ${ALERT_TTL_S:-0}
      DATA_DIR: /dados
      MAX_PENDING_EVENTS: ${MAX_PENDING_EVENTS:-10000}
      RABBIT_HOST: ${RABBIT_HOST:-rabbitmq}
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_VHOST: ${RABBIT_VHOST:-poolsafe}
      RABBIT_USER: ${RABBIT_USER:-poolsafe_python}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-}
      RABBIT_TLS: ${RABBIT_TLS:-false}
      RABBIT_CA_FILE: ${RABBIT_CA_FILE:-}
      RABBIT_EXCHANGE: ${RABBIT_EXCHANGE:-poolsafe.events}
      RABBIT_ALERT_KEY: ${RABBIT_ALERT_KEY:-risk.detected}
      RABBIT_HEARTBEAT_KEY: ${RABBIT_HEARTBEAT_KEY:-camera.heartbeat}
    volumes:
      - ${HOST_MODEL_DIR:-/opt/poolsafe/modelos/releases/modelo-002}:/modelos:ro
      - ${HOST_VIDEO_DIR:-/opt/poolsafe/entrada}:/entrada:ro
      - ${HOST_DATA_DIR:-/opt/poolsafe/dados/ensaio-modelo-002}:/dados
    networks:
      - poolsafe-network
    # GPU NVIDIA: descomentar após instalar NVIDIA Container Toolkit no host.
    # Também definir DEVICE=0. Validar driver/CUDA antes da demonstração.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  poolsafe-network:
    external: true
    name: ${DOCKER_NETWORK:-poolsafe-network}
