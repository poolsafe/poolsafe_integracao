name: poolsafe-worker

# Stack Portainer para execução do worker Python PoolSafe
# Integração: captura -> inferência (YOLO11) -> confirmação temporal -> outbox SQLite -> RabbitMQ
# Reutiliza a rede externa 'poolsafe-network' e o broker 'rabbitmq:5672' (vhost 'poolsafe').
# Não expõe portas externas nem cria serviços auxiliares.

services:
  poolsafe:
    image: ${WORKER_IMAGE:?Defina WORKER_IMAGE}
    container_name: ${CONTAINER_NAME:-poolsafe-worker}
    restart: "no" # Para primeiro ensaio; alterar para unless-stopped após homologação
    stop_grace_period: 45s
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CAMERA_ID: ${CAMERA_ID:-camera_teste_01}
      CODIGO_INTEGRACAO: ${CODIGO_INTEGRACAO:-}
      SOURCE_MODE: ${SOURCE_MODE:-video}
      SOURCE: ${SOURCE:-/entrada/teste.mp4}
      MODEL_PATH: /modelos/best.pt
      MODEL_VERSION: ${MODEL_VERSION:-candidato}
      DEVICE: ${DEVICE:-cpu}
      TEST_MODE: ${TEST_MODE:-true}
      ALLOW_TEST_PUBLISH: ${ALLOW_TEST_PUBLISH:-false}
      PUBLISH_RABBIT: ${PUBLISH_RABBIT:-false}
      INCLUDE_EVIDENCE: ${INCLUDE_EVIDENCE:-false}
      CONF: ${CONF:-0.25}
      IOU: ${IOU:-0.70}
      IMGSZ: ${IMGSZ:-640}
      FRAMES_PARA_ALERTA: ${FRAMES_PARA_ALERTA:-8}
      FRAMES_NORMAIS_ENCERRAR: ${FRAMES_NORMAIS_ENCERRAR:-15}
      COOLDOWN_S: ${COOLDOWN_S:-3}
      MAX_INTERVALO_S: ${MAX_INTERVALO_S:-0.5}
      LOST_RESET_S: ${LOST_RESET_S:-2}
      HEARTBEAT_INTERVAL_S: ${HEARTBEAT_INTERVAL_S:-30}
      HEARTBEAT_TTL_S: ${HEARTBEAT_TTL_S:-60}
      ALERT_TTL_S: ${ALERT_TTL_S:-0}
      DATA_DIR: /dados
      MAX_PENDING_EVENTS: ${MAX_PENDING_EVENTS:-10000}
      RABBIT_HOST: ${RABBIT_HOST:-rabbitmq}
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_VHOST: ${RABBIT_VHOST:-poolsafe}
      RABBIT_USER: ${RABBIT_USER:-poolsafe_python}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-}
      RABBIT_TLS: ${RABBIT_TLS:-false}
      RABBIT_CA_FILE: ${RABBIT_CA_FILE:-}
      RABBIT_EXCHANGE: ${RABBIT_EXCHANGE:-poolsafe.events}
      RABBIT_ALERT_KEY: ${RABBIT_ALERT_KEY:-risk.detected}
      RABBIT_HEARTBEAT_KEY: ${RABBIT_HEARTBEAT_KEY:-camera.heartbeat}
    volumes:
      - ${HOST_MODEL_DIR:-/opt/poolsafe/modelos/releases/modelo-001}:/modelos:ro
      - ${HOST_VIDEO_DIR:-/opt/poolsafe/entrada}:/entrada:ro
      - ${HOST_DATA_DIR:-/opt/poolsafe/dados/ensaio-modelo-001}:/dados
    networks:
      - poolsafe-network
    # GPU NVIDIA: descomentar após instalar NVIDIA Container Toolkit no host.
    # Também definir DEVICE=0. Validar driver/CUDA antes da demonstração.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  poolsafe-network:
    external: true
    name: ${DOCKER_NETWORK:-poolsafe-network}
